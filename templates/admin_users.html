{{template "head" .}}
<p class="small"><a href="/admin">← dashboard</a></p>
<h1>Users</h1>
{{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}
<form method="post" action="/admin/users" class="panel row">
<div><label>Username</label><input name="username" required></div>
<div><label>Password</label><input name="password" type="password" required></div>
<div><label>Role</label><select name="role"><option value="player">player</option><option value="dm">dm</option></select></div>
<div><button>Create account</button></div>
</form>
<form method="get" action="/admin/users" class="panel row" data-live>
<input type="hidden" name="dir" value="{{.Dir}}">
<div><label for="sort">Sort</label><select id="sort" name="sort"><option value="">Username</option><option value="role" {{if eq .Sort "role"}}selected{{end}}>Role</option><option value="created" {{if eq .Sort "created"}}selected{{end}}>Created</option></select></div>
<div><label>Order</label><button type="button" class="small" data-reverse data-dir="{{if eq .Dir "desc"}}asc{{else}}desc{{end}}">Reverse</button></div>
</form>
<table class="panel">
<tr><th>Username</th><th>Role</th><th>Created</th><th></th></tr>
{{range .Users}}
<tr><td>{{.Username}}</td><td>{{.Role}}</td><td class="small muted">{{.CreatedAt}}</td>
<td>{{if eq .Role "dm"}}<span class="small muted">—</span>{{end}}<form method="post" action="/admin/users/{{.ID}}/delete"><button class="small">Delete</button></form></td></tr>
{{end}}
</table>
{{template "foot" .}}
