<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Craftingo</title>
    <style>
      body {
        font-family: "Courier New", monospace;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
        background-color: #000;
        color: #0f0;
      }
      header {
        margin-bottom: 20px;
      }
      h1 {
        margin-bottom: 4px;
        text-transform: uppercase;
        border-bottom: 2px solid #0f0;
      }
      p.tagline {
        color: #0a0;
        margin-top: 0;
      }
      input {
        padding: 6px;
        margin: 4px 0;
        background-color: #111;
        border: 1px solid #0f0;
        color: #0f0;
      }
      button {
        padding: 6px 16px;
        margin: 4px 0;
        cursor: pointer;
        background-color: #0f0;
        color: #000;
        border: none;
        font-weight: bold;
      }
      button:hover {
        background-color: #0a0;
      }
      a {
        color: #0f0;
        text-decoration: underline;
        font-weight: bold;
      }
      a:hover {
        color: #fff;
      }
      section {
        margin-bottom: 20px;
      }
      .error {
        color: #f00;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Craftingo</h1>
      <p class="tagline">WIP.</p>
    </header>

    <main>
      <section id="login-section">
        <form onsubmit="login(event)">
          <input type="text" id="username" placeholder="Username" />
          <input type="password" id="password" placeholder="Password" />
          <button type="submit">Login</button>
        </form>
        <span id="login-error" class="error"></span>
      </section>

      <section id="logged-in-section" style="display: none">
        <p>
          Logged in as <strong id="display-user"></strong>.
          <button onclick="logout()">Logout</button>
        </p>
      </section>
    </main>

    <script>
      let authHeader = null;

      async function login(e) {
        e.preventDefault();

        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        const tempAuthHeader = "Basic " + btoa(user + ":" + pass);

        try {
          const resp = await fetch("/api/login", {
            method: "POST",
            headers: { Authorization: tempAuthHeader },
          });

          if (!resp.ok) {
            const text = await resp.text();
            throw new Error(text);
          }

          authHeader = tempAuthHeader;
          document.getElementById("login-section").style.display = "none";
          document.getElementById("logged-in-section").style.display = "block";
          document.getElementById("display-user").textContent = user;
          document.getElementById("login-error").textContent = "";
        } catch (err) {
          document.getElementById("login-error").textContent = err.message;
        }
      }

      function logout() {
        authHeader = null;

        document.getElementById("login-section").style.display = "block";
        document.getElementById("logged-in-section").style.display = "none";
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
      }
    </script>
  </body>
</html>
